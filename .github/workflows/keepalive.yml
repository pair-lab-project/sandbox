name: Aiven DB Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Aiven MySQL
    runs-on: ubuntu-latest
    steps:
      - name: Install mysql-client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Run SELECT 1 against Aiven
        run: |
          mysql --host="${{ secrets.AIVEN_DB_HOST }}" \
                --port="${{ secrets.AIVEN_DB_PORT }}" \
                --user="${{ secrets.AIVEN_DB_USER }}" \
                --password="${{ secrets.AIVEN_DB_PASSWORD }}" \
                --database="${{ secrets.AIVEN_DB_NAME }}" \
                --ssl-mode=REQUIRED \
                -e "SELECT 1;"
